name: Validate visibility observatory
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m visibility_observatory --run examples/sample.json --output build/site
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-preview-not-real-observations
          path: build/site/
