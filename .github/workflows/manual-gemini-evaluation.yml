name: Capture opt-in Gemini agent recommendations
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Closed-book only; Google Search grounding disabled for free-tier safety
        required: true
        type: choice
        options:
          - closed_book
      start_index:
        description: Zero-based offset in the 20-query benchmark (0 starts at G01; 2 starts at G03)
        required: true
        type: choice
        default: '0'
        options:
          - '0'
          - '2'
          - '3'
          - '5'
          - '10'
          - '15'
      max_queries:
        description: Maximum API requests (pilot with 1)
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '5'
          - '20'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test before API call
        run: python -m unittest discover -s tests -v
      - name: Capture unadjudicated agent responses
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_MODE: ${{ inputs.mode }}
          MAX_QUERIES: ${{ inputs.max_queries }}
          START_INDEX: ${{ inputs.start_index }}
        run: python -m visibility_observatory.gemini --mode "$EVAL_MODE" --max-queries "$MAX_QUERIES" --start-index "$START_INDEX"
      - name: Require a complete, nonempty pilot answer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/observations/gemini.json").read_text())
          samples = report.get("samples", [])
          if not samples or any(item.get("status") != "complete" for item in samples):
              raise SystemExit("Gemini returned an incomplete or errored response; inspect artifact.")
          print(f"Validated {len(samples)} nonempty Gemini response(s)")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-unadjudicated-${{ inputs.mode }}
          path: build/observations/gemini.json
          retention-days: 30
